name: java-util-commit-survival

project:
  repo: /Users/gary/_experiment/java-util
  language: java
  build: maven
  module: .
  test_framework: junit5

anchor: "2.18.0"                  # 2024-10-17. Codex probe at this anchor: 1,204 Dev methods run by the build
range:
  branch: origin/master
  end: 3db3dd5085906a767c04fbce26fded9529d7e856   # tag 3.4.0, 462 first-parent commits after the anchor
  mode: first-parent
  limit: 300                      # weekly scale. Releases inside: 3.0.2 (#125), 3.3.2 (#211)
  skip_untouched: main-sources

scope:
  rule: change-ranked             # inspect population/scope.md after --until scope; switch to explicit if the result is too small
  rank_by: change-count
  min_methods: 3
  exclude_accessor_heavy: true
  target_methods: [50, 80]
  max_dev_scope: 400
  max_classes: 10
  classes: []
  min_classes: 1

dev:
  discovery: build                # developer candidates = tests the project's own surefire run executes
  unmapped: exclude
  stable_runs: 1                  # one passing run at t (decided 2026-11-05)
  exclude:                        # tests that leave runaway threads in the shared coverage/survival JVM
    - com.cedarsoftware.util.ConcurrentList2Test#testConcurrentOperations
  groups:
    - name: dev
      denominator: project
      frozen: false
    - name: dev-scope
      display: "Dev (scope)"
      denominator: coverage-scoped
      derive_from: dev

model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /Users/gary/_experiment/KTester/docker/.env
  env_key: OPENROUTER_API_KEY

generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /Users/gary/_experiment/KTester
    docker:
      compose_files:
        - /Users/gary/_experiment/KTester/docker/compose.yml
        - /Users/gary/_experiment/KTester/docker/compose.java-util.yml
      service: ktester
      mounts:
        /Users/gary/_experiment/java-util: /repo
        /Users/gary/_experiment/KTester: /work
    params: {fix_tries: 3, temperature: 0.5, workers: 8}
    rounds: {max: 1}

  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 2, until_dev_matched: false, stop_after_zero_compile: 2}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}

screen:
  stable_runs: 1
  dedup: exact-body
  matching: none

survival:
  execution: batch                # one JVM batch per commit; survival and scope line coverage in one pass
  selection: affected             # rerun only tests whose dependencies changed
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: []
    max_reruns: 3
    backoff_seconds: 5

coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering

runner:
  docker:
    image: survival-java:25
    mounts:
      /Users/gary/_experiment/java-util: /repo
    env_file: /Users/gary/_experiment/KTester/docker/.env
  javac_mode: reused-jvm          # JDK 25 runner only
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 2, survive: 2, cover: 2}   # Mac mini: 8 GB RAM, Docker memory 5 GB
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}
