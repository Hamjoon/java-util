name: java-util-all-classes-commit-survival
project:
  repo: /opt/experiment/experiment-projects/java-util
  language: java
  build: maven
  module: .
  test_framework: junit5
anchor: "2.18.0"                  # 2024-10-17
range:
  branch: origin/master
  end: 3db3dd5085906a767c04fbce26fded9529d7e856   # tag 3.4.0, 462 first-parent commits after the anchor
  mode: first-parent
  limit: 300                      # same 300 commits as 2026-11 week 1. Releases inside: 3.0.2 (#125), 3.3.2 (#211)
  skip_untouched: main-sources
scope:
  rule: all-eligible              # every production class with at least one target method (2026-11 week 2 decision)
  rank_by: change-count
  min_methods: 1
  exclude_accessor_heavy: false
  target_methods: [50, 80]        # ignored by all-eligible
  max_dev_scope: 400              # ignored by all-eligible
  max_classes: 10                 # ignored by all-eligible
  classes: []
  min_classes: 1
dev:
  discovery: build                # developer candidates = tests the project's own surefire run executes
  unmapped: exclude
  stable_runs: 1                  # one passing run at t (decided 2026-11-05)
  exclude:                        # tests that leave runaway threads in the shared coverage/survival JVM
    - com.cedarsoftware.util.ConcurrentList2Test#testConcurrentOperations
  groups:
    - name: dev                   # project-wide developer tests, measured (2026-11 week 2 decision)
      denominator: project
model:
  provider: openrouter
  name: openai/gpt-oss-120b
  env_file: /opt/experiment/setup/model.env
  env_key: OPENROUTER_API_KEY
generators:
  - name: ktester
    display: KTester
    method: ktester
    impl: author-tool
    tool_path: /opt/experiment/experiment-projects/KTester
    docker:
      compose_files:
        - /opt/experiment/experiment-projects/KTester/docker/compose.yml
        - /opt/experiment/setup/ktester-lab.compose.yml   # lab container only: mem_limit 48g (KTester workers 32; 4 concurrent = 192g of 251g)
      service: ktester
      mounts:
        /opt/experiment/experiment-projects/java-util: /repo
        /opt/experiment/experiment-projects/KTester: /work
    params: {fix_tries: 3, temperature: 0.5, workers: 32}   # lab server (64 cores). Lower on OpenRouter 429 and record the value
    rounds: {max: 1}
  - name: ouedraogo
    display: Ouédraogo
    method: ouedraogo
    impl: native
    params: {prompts: [ZSL, FSL, CoT, ToT, GToT], temperature: 0.7, max_tokens: 16384}
    rounds: {max: 1}
    context:
      dependency_signatures: {enabled: true, max_types: 15, max_lines: 400}
    prompt:
      api_constraint: true
    postprocess:
      import_repair: {enabled: true, passes: 2}
screen:
  stable_runs: 1
  dedup: exact-body
  matching: none
survival:
  control_failures: exclude
  execution: batch                # one JVM batch per commit; survival and changed-line coverage in one pass
  selection: affected             # rerun only tests whose dependencies changed
  definition: cumulative-fixed-denominator
  flaky_rerun: 1
  build_fail: carry-over
  environment_errors:
    patterns: []
    max_reruns: 3
    backoff_seconds: 5
coverage:
  changed_line: true
  at_anchor: true
  groups: alive-entering
runner:
  docker:
    image: survival-java:25
    mounts:
      /opt/experiment/experiment-projects/java-util: /repo
    env_file: /opt/experiment/setup/model.env
  javac_mode: reused-jvm          # JDK 25 runner only
  reuse:
    checkouts: null
    classpath_cache: null
  workers: {build: 16, survive: 32, cover: 32}   # lab server: 64 cores, 251 GB
  timeouts: {build: 600, compile: 300, test_class: 120}
  jvm: {launcher: 1g, javac: 512m, jacoco: 1g}
  cache: {classpath: pom-sha256, node_modules: lockfile-sha256}
